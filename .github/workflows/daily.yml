name: Daily LinkedIn Post

on:
  schedule:
    # 04:00 UTC = 08:00 in the UAE (UTC+4)
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: linkedin-poster
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Generate and send post
        run: node src/main.js
        env:
          GITHUB_USERNAME: Saif-jaber
          GH_PAT: ${{ secrets.GH_PAT || github.token }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HCTI_USER_ID: ${{ secrets.HCTI_USER_ID }}
          HCTI_API_KEY: ${{ secrets.HCTI_API_KEY }}

      - name: Save history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp history.json "$RUNNER_TEMP/history.local.json"
          git fetch origin "$GITHUB_REF_NAME"
          git reset --hard "origin/$GITHUB_REF_NAME"
          node -e '
            const fs = require("fs");
            const local = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/history.local.json", "utf8"));
            const remote = JSON.parse(fs.readFileSync("history.json", "utf8"));
            const rows = new Map(remote.map(r => [r.id, r]));
            for (const r of local) rows.set(r.id, r);
            const merged = [...rows.values()].sort((a, b) => String(a.id).localeCompare(String(b.id)));
            fs.writeFileSync("history.json", JSON.stringify(merged, null, 2) + "\n");
          '
          git add history.json
          git diff --cached --quiet || (git commit -m "chore: update post history" && git push)
